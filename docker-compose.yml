services:
  app-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ayd
      POSTGRES_PASSWORD: ayd
      POSTGRES_DB: ayd
    ports:
      - '5434:5432'
    volumes:
      - app_db_data_18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ayd -d ayd']
      interval: 5s
      timeout: 5s
      retries: 20

  sample-db:
    build:
      context: ./infra/sample-db
    environment:
      POSTGRES_USER: sample_admin
      POSTGRES_PASSWORD: sample_admin
      POSTGRES_DB: sample
    ports:
      - '5433:5432'
    volumes:
      - ./infra/sample-db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/sample-db/multi-schema.sql:/docker-entrypoint-initdb.d/02-multi-schema.sql:ro
      - sample_db_data_18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sample_admin -d sample']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: '3000'
      LOG_LEVEL: info
      DATABASE_URL: postgresql://ayd:ayd@app-db:5432/ayd
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: local-development-jwt-secret-32b-min
      DEV_LOGIN_ENABLED: 'true'
      APP_WEB_ORIGIN: http://localhost:5173
      GOOGLE_REDIRECT_URI: http://localhost:3000/v1/auth/google/callback
      CRYPTO_MASTER_KEY_VERSION: '1'
      CRYPTO_MASTER_KEYS: '1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
      SSRF_ALLOW_PRIVATE: 'true'
      EGRESS_IP: 192.0.2.10
    ports:
      - '3000:3000'
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

# PostgreSQL 18 keeps its data under /var/lib/postgresql/18 and cannot open a 16 data
# directory, so the database volumes are named per major version.
volumes:
  app_db_data_18:
  sample_db_data_18:
  redis_data:
